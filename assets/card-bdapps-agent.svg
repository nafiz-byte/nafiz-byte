<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 172" width="800" height="172" role="img" aria-labelledby="t d">
  <title id="t">bdapps Revenue Agent</title>
  <desc id="d">A daily job that signs in to each bdapps developer account, pulls month-to-date revenue, filters it and sends one Telegram report. Python, pytest, GitHub Actions.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .lit { opacity: 0; animation-duration: 9s; animation-iteration-count: infinite; }
    @keyframes l0 { 0%, 3% { opacity: 0; } 6%, 90% { opacity: 1; } 100% { opacity: 0; } }
    .l0 { animation-name: l0; }
    @keyframes l1 { 0%, 23.67% { opacity: 0; } 26.67%, 90% { opacity: 1; } 100% { opacity: 0; } }
    .l1 { animation-name: l1; }
    @keyframes l2 { 0%, 44.33% { opacity: 0; } 47.33%, 90% { opacity: 1; } 100% { opacity: 0; } }
    .l2 { animation-name: l2; }
    @keyframes l3 { 0%, 65% { opacity: 0; } 68%, 90% { opacity: 1; } 100% { opacity: 0; } }
    .l3 { animation-name: l3; }
    @media (prefers-reduced-motion: reduce) { .lit { animation: none; opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="799" height="171" rx="14" fill="#151b23" stroke="#3d444d"/>

  <text class="mono" x="44" y="52" font-size="11.5" letter-spacing="2" fill="#f0883e">02 / AUTOMATION</text>
  <text class="sans" x="43" y="94" font-size="30" font-weight="700" fill="#f0f6fc">bdapps Revenue Agent</text>
  <rect x="44.5" y="114.5" width="66" height="24" rx="12" fill="none" stroke="#3d444d"/>
  <text class="mono" x="77.5" y="130.5" font-size="12" text-anchor="middle" fill="#9198a1">Python</text>
  <rect x="118.5" y="114.5" width="66" height="24" rx="12" fill="none" stroke="#3d444d"/>
  <text class="mono" x="151.5" y="130.5" font-size="12" text-anchor="middle" fill="#9198a1">pytest</text>
  <rect x="192.5" y="114.5" width="126" height="24" rx="12" fill="none" stroke="#3d444d"/>
  <text class="mono" x="255.5" y="130.5" font-size="12" text-anchor="middle" fill="#9198a1">GitHub Actions</text>

  <text class="mono" x="756" y="52" font-size="11.5" text-anchor="end" fill="#656c76">every day · 06:00</text>
  <circle cx="506" cy="73.5" r="5.5" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
  <text class="mono" x="524" y="78" font-size="12.5" fill="#9198a1">sign in to each account</text>
  <g class="lit l0"><circle cx="506" cy="73.5" r="6.5" fill="#f0883e"/><path d="M503.2 73.7 L505.1 75.6 L508.9 71.4" fill="none" stroke="#151b23" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text class="mono" x="524" y="78" font-size="12.5" fill="#f0f6fc">sign in to each account</text></g>
  <circle cx="506" cy="94.5" r="5.5" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
  <text class="mono" x="524" y="99" font-size="12.5" fill="#9198a1">pull month-to-date revenue</text>
  <g class="lit l1"><circle cx="506" cy="94.5" r="6.5" fill="#f0883e"/><path d="M503.2 94.7 L505.1 96.6 L508.9 92.4" fill="none" stroke="#151b23" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text class="mono" x="524" y="99" font-size="12.5" fill="#f0f6fc">pull month-to-date revenue</text></g>
  <circle cx="506" cy="115.5" r="5.5" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
  <text class="mono" x="524" y="120" font-size="12.5" fill="#9198a1">keep apps with revenue &gt; 0</text>
  <g class="lit l2"><circle cx="506" cy="115.5" r="6.5" fill="#f0883e"/><path d="M503.2 115.7 L505.1 117.6 L508.9 113.4" fill="none" stroke="#151b23" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text class="mono" x="524" y="120" font-size="12.5" fill="#f0f6fc">keep apps with revenue &gt; 0</text></g>
  <circle cx="506" cy="136.5" r="5.5" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
  <text class="mono" x="524" y="141" font-size="12.5" fill="#9198a1">send one Telegram report</text>
  <g class="lit l3"><circle cx="506" cy="136.5" r="6.5" fill="#f0883e"/><path d="M503.2 136.7 L505.1 138.6 L508.9 134.4" fill="none" stroke="#151b23" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text class="mono" x="524" y="141" font-size="12.5" fill="#f0f6fc">send one Telegram report</text></g>
</svg>
