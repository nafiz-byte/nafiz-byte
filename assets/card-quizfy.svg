<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 172" width="800" height="172" role="img" aria-labelledby="t d">
  <title id="t">QuizFy</title>
  <desc id="d">A Bangla quiz app with LLM-written multiple-choice questions. Django, PostgreSQL, OpenRouter.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pick { opacity: 0; animation-duration: 8s; animation-iteration-count: infinite; }
    @keyframes p0 { 0%, 22% { opacity: 1; } 25%, 97% { opacity: 0; } 100% { opacity: 1; } }
    .p0 { animation-name: p0; }
    @keyframes p2 { 0%, 22% { opacity: 0; } 25%, 47% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .p2 { animation-name: p2; }
    @keyframes p1 { 0%, 47% { opacity: 0; } 50%, 72% { opacity: 1; } 75%, 100% { opacity: 0; } }
    .p1 { animation-name: p1; }
    @keyframes p3 { 0%, 72% { opacity: 0; } 75%, 97% { opacity: 1; } 100%, 100% { opacity: 0; } }
    .p3 { animation-name: p3; }
    @media (prefers-reduced-motion: reduce) { .pick { animation: none; } .p0 { opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="799" height="171" rx="14" fill="#151b23" stroke="#3d444d"/>

  <text class="mono" x="44" y="52" font-size="11.5" letter-spacing="2" fill="#f0883e">03 / WEB APP</text>
  <text class="sans" x="43" y="94" font-size="30" font-weight="700" fill="#f0f6fc">QuizFy</text>
  <rect x="44.5" y="114.5" width="66" height="24" rx="12" fill="none" stroke="#3d444d"/>
  <text class="mono" x="77.5" y="130.5" font-size="12" text-anchor="middle" fill="#9198a1">Django</text>
  <rect x="118.5" y="114.5" width="96" height="24" rx="12" fill="none" stroke="#3d444d"/>
  <text class="mono" x="166.5" y="130.5" font-size="12" text-anchor="middle" fill="#9198a1">PostgreSQL</text>
  <rect x="222.5" y="114.5" width="96" height="24" rx="12" fill="none" stroke="#3d444d"/>
  <text class="mono" x="270.5" y="130.5" font-size="12" text-anchor="middle" fill="#9198a1">OpenRouter</text>

  <text class="mono" x="756" y="52" font-size="11.5" text-anchor="end" fill="#656c76">15 questions per round</text>
  <rect x="500" y="66" width="256" height="8" rx="4" fill="#3d444d"/>
  <rect x="500" y="80" width="168" height="8" rx="4" fill="#3d444d"/>
