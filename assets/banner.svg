<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Nafiz — Web Application Developer</title>
  <desc id="desc">Editorial dark banner introducing Nafiz, a web application developer building useful web products, APIs, and automations with Python.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#10151d"/><stop offset="1" stop-color="#0a0f16"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#f0883e" stop-opacity=".16"/><stop offset="1" stop-color="#f0883e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38404b" stroke-opacity=".22" stroke-width=".8"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1098" height="358" rx="19"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1098" height="358" rx="19" fill="url(#bg)" stroke="#313a45" stroke-width="1.5"/>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1100" height="360" fill="url(#grid)"/>
    <circle cx="914" cy="95" r="260" fill="url(#halo)"/>
    <path d="M 0 316 H 1100" stroke="#303945" stroke-width="1"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="60" y="49" width="8" height="8" rx="2" fill="#f0883e"/>
    <text x="82" y="58" fill="#f0a86a" font-size="13" font-weight="700" letter-spacing="2.8">WEB APPLICATION DEVELOPER</text>
    <text x="58" y="158" fill="#f3f6fb" font-size="77" font-weight="780" letter-spacing="-3.5">Hi, I'm Nafiz.</text>
    <text x="61" y="205" fill="#c5cbd4" font-size="22" font-weight="400">I build useful things for the web.</text>
    <text x="61" y="241" fill="#87919e" font-size="16">Products. Backends. APIs. Automation.</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="60" y="338" font-size="13" fill="#8d98a7" letter-spacing="1">PYTHON</text>
    <circle cx="135" cy="333" r="2" fill="#f0883e"/>
    <text x="151" y="338" font-size="13" fill="#8d98a7" letter-spacing="1">FASTAPI</text>
    <circle cx="245" cy="333" r="2" fill="#f0883e"/>
    <text x="261" y="338" font-size="13" fill="#8d98a7" letter-spacing="1">DJANGO</text>
    <text x="1040" y="338" text-anchor="end" font-size="13" fill="#f0883e" letter-spacing="1">NAFIZ.XYZ / 2026</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="674" y="61" width="364" height="229" rx="14" fill="#111923" stroke="#39434f" stroke-width="1.5"/>
    <path d="M 674 104 H 1038" stroke="#323d49"/>
    <circle cx="697" cy="83" r="5" fill="#fb7b72"/><circle cx="715" cy="83" r="5" fill="#e3b341"/><circle cx="733" cy="83" r="5" fill="#3fb950"/>
    <text x="856" y="88" text-anchor="middle" fill="#84909d" font-size="12">~/nafiz/workspace</text>
    <text x="702" y="140" fill="#596776" font-size="13">01</text>
    <text x="735" y="140" fill="#bfcbd7" font-size="13">focus</text>
    <text x="790" y="140" fill="#f0883e" font-size="13">=</text>
    <text x="807" y="140" fill="#a7c4f1" font-size="13">"web apps"</text>
    <text x="702" y="170" fill="#596776" font-size="13">02</text>
    <text x="735" y="170" fill="#bfcbd7" font-size="13">build</text>
    <text x="790" y="170" fill="#f0883e" font-size="13">=</text>
    <text x="807" y="170" fill="#a7c4f1" font-size="13">"with purpose"</text>
    <text x="702" y="200" fill="#596776" font-size="13">03</text>
    <text x="735" y="200" fill="#bfcbd7" font-size="13">mindset</text>
    <text x="797" y="200" fill="#f0883e" font-size="13">=</text>
    <text x="814" y="200" fill="#a7c4f1" font-size="13">"ship &amp; learn"</text>
    <path d="M 700 227 H 1011" stroke="#2c3743"/>
    <circle cx="709" cy="256" r="5" fill="#3fb950"/>
    <text x="725" y="260" fill="#9acda6" font-size="12" letter-spacing="1">CURRENTLY BUILDING</text>
    <text x="1008" y="260" text-anchor="end" fill="#647280" font-size="12">●</text>
