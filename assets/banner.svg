    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc08c"/><stop offset=".55" stop-color="#e89152"/><stop offset="1" stop-color="#b75f35"/></linearGradient>
    <pattern id="lines" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#69717e" stroke-opacity=".11" stroke-width="1"/></pattern>
    <pattern id="micro" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".6" fill="#8c99a7" opacity=".23"/></pattern>
    <clipPath id="outer"><rect x="1" y="1" width="1118" height="428" rx="20"/></clipPath>
    <clipPath id="monoclip"><rect x="743" y="111" width="299" height="248" rx="18"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1118" height="428" rx="20" fill="url(#base)" stroke="#38414b" stroke-width="1.5"/>
