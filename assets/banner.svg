<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Nafiz — Building useful software</title>
  <desc id="dsc">Premium editorial banner for Nafiz, a web application developer, with refined typography and a copper monogram.</desc>
  <defs>
